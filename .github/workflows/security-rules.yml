name: Gonah Security Rules Tests

on:
  push:
    branches: [main, security-rules-tests]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: security-test/package-lock.json

      - name: Install isolated test dependencies
        working-directory: security-test
        run: npm ci

      - name: Run Firestore and Storage security tests
        working-directory: security-test
        run: |
          npx --yes firebase-tools@15.34.0 emulators:exec \
            --only firestore,storage \
            --project demo-gonah-security-test \
            --config firebase.json \
            "npm run test:rules"
